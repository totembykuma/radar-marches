# Vidéos explicatives avec voix off (page /videos/ et espace client), faites par scripts/videos_voix.py (workflow videos.yml).
# Une vidéo = une suite de scènes filmées sur le vrai site (espace client simulé, aucun compte réel).
#   page    : adresse ouverte au début de la scène (« #ancre » seule = même page, sans fondu). Absente = on reste où l'on est.
#   phrases : dites par la voix, l'une après l'autre ; « texte » = sous-titre, « dit » = prononciation si elle diffère.
#   actions : t = secondes depuis le début de la scène, ou « p2 » / « p2+1.5 » = début de la 2e phrase (+ 1,5 s).
#             defiler (cible ou y, d), curseur (cible, d), clic (cible), taper (cible, texte, d), fichier (cible, nom),
#             surligner (cible, d), cacher (cible).
# Après modification : relancer le workflow videos.yml (aperçu sur la branche apercu-videos).
voix: fr-FR-VivienneMultilingualNeural
videos:
  - id: decouvrir-radar-marches
    titre: "Découvrir Radar Marchés"
    affiche: 4          # scène montrée en image d'attente
    scenes:
      - page: /
        phrases:
          - texte: "Chaque jour, des centaines d'appels d'offres publics sont publiés. Impossible de tout lire."
          - texte: "Radar Marchés les lit pour vous, chaque nuit, dans le BOAMP."
            dit: "Radar Marchés les lit pour vous, chaque nuit, dans le Bulletin officiel des marchés publics."
        actions:
          - {a: surligner, cible: ".a-hero h1", t: 0.6, d: 3.2}
          - {a: curseur, cible: ".a-live", t: "p2", d: 1}
      - phrases:
          - texte: "Le matin, à 6 h 20, vous recevez un e-mail avec seulement les marchés de votre métier, dans vos départements."
            dit: "Le matin, à six heures vingt, vous recevez un e-mail avec seulement les marchés de votre métier, dans vos départements."
        actions:
          - {a: curseur, cible: ".a-mail", t: 0.3, d: 1.1}
          - {a: surligner, cible: ".a-mail", t: 1.2, d: 4}
          - {a: curseur, cible: ".a-mail-liste li:first-child", t: 3, d: 0.8}
      - page: /_videos/email.html
        url: "Votre boîte de réception"
        phrases:
          - texte: "Pour chaque marché : l'objet, l'acheteur, le lieu, la date limite et le lien vers l'avis officiel."
          - texte: "Pas de tri à faire. Vous lisez, et vous décidez."
        actions:
          - {a: defiler, y: 260, t: 1.5, d: 4}
      - page: /#comment
        phrases:
          - texte: "Vous choisissez votre métier et vos départements une seule fois. Ensuite, plus rien à faire."
        actions:
          - {a: curseur, cible: "#comment .a-etapes > li:nth-child(1)", t: 0.8, d: 1}
          - {a: curseur, cible: "#comment .a-etapes > li:nth-child(3)", t: 3.5, d: 1.4}
      - page: /#fiche
        phrases:
          - texte: "Avec l'offre Pro, chaque marché a sa fiche « avant de répondre » :"
          - texte: "ce que l'acheteur a déjà payé, combien d'entreprises ont répondu, et qui a gagné."
        actions:
          - {a: curseur, cible: ".a-fiche-titre", t: 0.8, d: 1}
          - {a: surligner, cible: ".a-fiche-kpi", t: "p2", d: 4}
          - {a: curseur, cible: ".a-fiche-kpi", t: "p2+0.2", d: 1}
      - page: /compte/#apercu
        url: "radar-marches.fr/compte/"
        phrases:
          - texte: "Dans votre espace client : vos marchés ouverts, vos favoris et vos dates limites, d'un coup d'œil."
        actions:
          - {a: curseur, cible: "#a-kpis .kpi:nth-child(2)", t: 0.8, d: 1}
          - {a: curseur, cible: "#a-kpis .kpi:nth-child(3)", t: 3, d: 0.8}
      - page: "#marches"
        phrases:
          - texte: "Avec Clé en main, un marché vous intéresse ? En un clic : un rapport pour le gagner, ou un dossier de candidature prêt à relire."
        actions:
          - {a: curseur, cible: "#l-marches .marche-pied button", t: 1.5, d: 1.2}
          - {a: surligner, cible: "#l-marches .marche .marche-pied", t: 2.8, d: 3.5}
      - page: /#tarifs
        phrases:
          - texte: "7 jours d'essai gratuit, sans engagement."
            dit: "Sept jours d'essai gratuit, sans engagement."
          - texte: "Et votre prix baisse avec l'ancienneté : dès le 3e mois, puis dès le 6e."
            dit: "Et votre prix baisse avec l'ancienneté : dès le troisième mois, puis dès le sixième."
        actions:
          - {a: defiler, cible: ".a-plans", t: 0.2, d: 1.2, marge: 150}
          - {a: curseur, cible: ".a-plan.featured", t: 1.2, d: 1}
          - {a: surligner, cible: ".a-plan.featured .a-paliers", t: "p2", d: 4}
      - page: /_videos/fin.html
        url: "radar-marches.fr"
        phrases:
          - texte: "Radar Marchés. Les marchés publics de votre métier, avant vos concurrents."
          - texte: "Essai gratuit sur radar-marches.fr"
            dit: "Essai gratuit, sur radar tiret marchés point f r."

  - id: creer-un-dossier
    titre: "Votre dossier de candidature en 3 étapes"
    affiche: 3
    scenes:
      - page: /compte/#marches
        url: "radar-marches.fr/compte/"
        phrases:
          - texte: "Voici comment obtenir un dossier de candidature complet, en trois étapes."
        actions:
          - {a: curseur, cible: "#l-marches .marche .marche-titre", t: 0.8, d: 1.2}
      - phrases:
          - texte: "Un : choisissez le marché. Sous l'appel d'offres, cliquez sur « Dossier »."
        actions:
          - {a: curseur, cible: "#l-marches .marche .marche-pied button:has-text('Dossier')", t: 0.6, d: 1.2}
          - {a: clic, cible: "#l-marches .marche .marche-pied button:has-text('Dossier')", t: 2.6}
          - {a: surligner, cible: "#dd-marche", t: 3.3, d: 2}
      - phrases:
          - texte: "Deux : présentez votre entreprise. Son nom, son SIRET, quelques références."
            dit: "Deux : présentez votre entreprise. Son nom, son numéro SIRET, quelques références."
          - texte: "C'est gardé pour la prochaine fois."
        actions:
          - {a: curseur, cible: "#dd-suite", t: 0.2, d: 0.8}
          - {a: clic, cible: "#dd-suite", t: 1.1}
          - {a: taper, cible: "#dd-nom", texte: "Net Pro SARL", t: 1.6, d: 1}
          - {a: taper, cible: "#dd-siret", texte: "123 456 789 00012", t: 2.7, d: 1.1}
          - {a: taper, cible: "#dd-dirigeant", texte: "M. Martin, gérant", t: 3.9, d: 1}
          - {a: taper, cible: "#dd-effectif", texte: "12 salariés", t: 5, d: 0.7}
          - {a: taper, cible: "#dd-activite", texte: "Nettoyage de locaux publics en Gironde depuis 2012.", t: "p2", d: 1.4}
          - {a: taper, cible: "#dd-refs", texte: "Mairie de Talence, nettoyage école, 2025, 40 000 €/an", t: "p2+1.5", d: 1.4}
      - phrases:
          - texte: "Ajoutez vos pièces : Kbis, attestation URSSAF… Le dossier de consultation est facultatif."
            dit: "Ajoutez vos pièces : extrait Kbis, attestation Urssaf… Le dossier de consultation est facultatif."
        actions:
          - {a: curseur, cible: "#dd-suite", t: 0.1, d: 0.7}
          - {a: clic, cible: "#dd-suite", t: 0.9}
          - {a: curseur, cible: "#dd-miennes li[data-type=kbis]", t: 1.4, d: 0.8}
          - {a: fichier, cible: "#dd-miennes li[data-type=kbis] input", nom: "kbis.pdf", t: 2.3}
          - {a: curseur, cible: "#dd-miennes li[data-type=urssaf]", t: 2.8, d: 0.7}
          - {a: fichier, cible: "#dd-miennes li[data-type=urssaf] input", nom: "urssaf.pdf", t: 3.6}
      - phrases:
          - texte: "Un récapitulatif vous montre ce qui manque encore."
        actions:
          - {a: curseur, cible: "#dd-suite", t: 0.1, d: 0.7}
          - {a: clic, cible: "#dd-suite", t: 0.9}
          - {a: surligner, cible: "#dd-reste", t: 1.6, d: 2.5}
      - phrases:
          - texte: "Trois : envoyez. Votre dossier est prêt en moins de 40 minutes."
            dit: "Trois : envoyez. Votre dossier est prêt en moins de quarante minutes."
        actions:
          - {a: curseur, cible: "#dd-envoyer", t: 0.2, d: 0.9}
          - {a: clic, cible: "#dd-envoyer", t: 1.3}
          - {a: defiler, cible: "#l-demandes", t: 2.4, d: 1.2, marge: 200}
          - {a: cacher, cible: "#toast", t: 3.4}
      - page: /_videos/word.html
        url: "Dossier de candidature.docx"
        phrases:
          - texte: "Vous recevez un document Word : l'essentiel en page 1, les 4 choses qu'il vous reste à faire, et tout le reste déjà rédigé."
            dit: "Vous recevez un document Word : l'essentiel en page un, les quatre choses qu'il vous reste à faire, et tout le reste déjà rédigé."
          - texte: "Relisez, ajoutez vos prix, signez et déposez."
        actions:
          - {a: surligner, cible: ".z-reste", t: 2.5, d: 3.5}
      - page: /_videos/fin.html
        url: "radar-marches.fr"
        phrases:
          - texte: "Radar Marchés. Moins de paperasse, plus de marchés gagnés."
