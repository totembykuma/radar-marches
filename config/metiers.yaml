# Chaque métier = mots-clés recherchés dans l'objet et les descripteurs BOAMP.
# Les mots sont comparés sans accents ni majuscules. "exclure" retire les faux positifs.
# "cpv" : débuts de codes CPV, pour retrouver l'historique d'un acheteur dans les données essentielles.
# Le texte détaillé de l'avis n'est lu que si "texte: true" (sinon trop de faux positifs).
nettoyage:
  libelle: "Nettoyage et propreté"
  cpv: ["9090", "9091"]   # codes des marchés attribués (données essentielles)
  mots: ["nettoyage", "proprete", "entretien des locaux", "lavage des vitres", "nettoyage des vitres", "menage", "desinfection"]
  exclure: ["nettoyage de voirie", "nettoyage urbain", "nettoiement", "balayage", "balayeuse", "colonnes", "conteneur", "viabilite hivernale", "assainissement", "ordures", "dechets", "deratisation"]
