# Paramètres du business. Modifiable sans toucher au code.
nom: "Radar Marchés"
slogan: "Les appels d'offres publics de votre métier et de votre région, chaque matin dans votre boîte mail."
site_url: "https://www.radar-marches.fr"
email_contact: "contact@radar-marches.fr"     # adresse de support (Resend / boîte mail)
email_expediteur: "Radar Marchés <alertes@radar-marches.fr>"
email_proprietaire: ""                        # ton e-mail perso pour les rapports (secret OWNER_EMAIL prioritaire)
acces_proprietaire:                           # accès offert au propriétaire (adresse = secret OWNER_EMAIL), hors stats ; critères modifiables dans l'espace
  plan: "cle"
  metiers: ["nettoyage"]
  departements: [75]

# Prix dégressifs : prix_mensuel les 2 premiers mois payés, puis chaque palier à partir de son mois.
# Résilier puis se réabonner = retour au prix de départ. Les offres annuelles ne sont plus vendues (liens désactivés).
offres:
  essentiel:
    nom: "Essentiel"
    prix_mensuel: 29
    metiers_max: 1
    departements_max: 1
    lien_paiement: "https://buy.stripe.com/eVqdR2eUg7HrdHj9H23F602"   # Stripe Payment Link (rempli après création)
    paliers: [{des_mois: 3, prix: 19.99}, {des_mois: 6, prix: 9.99}]   # prix selon l'ancienneté (radar/paliers.py)
    stripe_paliers: []   # rempli par stripe.yml : prix Stripe de chaque palier, dans l'ordre
    stripe_price_ids: ["price_1UQrs879764n3f0zMVMks2Dq", "price_1UQtSV79764n3f0zjjYuho8o"]
  pro:
    nom: "Pro"
    prix_mensuel: 49
    metiers_max: 1
    departements_max: 101
    lien_paiement: "https://buy.stripe.com/00w8wI4fC1j36eRbPa3F603"
    paliers: [{des_mois: 3, prix: 39.99}, {des_mois: 6, prix: 29.99}]   # prix selon l'ancienneté (radar/paliers.py)
    stripe_paliers: []   # rempli par stripe.yml : prix Stripe de chaque palier, dans l'ordre
    stripe_price_ids: ["price_1UQrs879764n3f0zbVlgAi7W", "price_1UQtSW79764n3f0zcOnqqpEh"]
  # Offre « Clé en main » : tout Pro + rapports « comment gagner » + dossiers prêts à signer inclus (radar/rapport.py, radar/dossier.py).
  # Visible sur le site seulement quand l'IA est active (comme l'option dossier).
  cle:
    nom: "Clé en main"
    prix_mensuel: 149
    metiers_max: 1
    departements_max: 101
    dossiers_inclus: 2  # par mois, à partir du 1er paiement ; le suivant au prix dossier.prix_cle
    rapports_max: 20    # rapports « comment gagner » par mois
    lien_paiement: "https://buy.stripe.com/aFa00c4fCf9TeLncTe3F608"   # rempli par le workflow stripe.yml
    paliers: [{des_mois: 3, prix: 119.99}, {des_mois: 6, prix: 99.99}]   # prix selon l'ancienneté (radar/paliers.py)
    stripe_paliers: []   # rempli par stripe.yml : prix Stripe de chaque palier, dans l'ordre
    stripe_price_ids: ["price_1URDTv79764n3f0zoMkKYfW3", "price_1URDTw79764n3f0zfqAbnyOv"]
# Promo mensuelle : chaque mois, du lundi au vendredi de la « semaine » choisie (3 = semaine du 3e lundi),
# les N premiers abonnés Pro (mensuel) de chaque jour paient « prix » € pendant « mois » mois.
# Le code du jour (ex. PRO1910 = 19 octobre) est créé dans Stripe vers minuit (workflow promo.yml), limité à N utilisations.
promo:
  publie: true         # true = bandeau visible sur le site et codes créés dans Stripe
  offre: "pro"
  semaine: 3
  places_par_jour: 5
  prix: 29
  mois: 2             # = les 2 premiers mois au prix de départ, puis la grille normale
# Option « Dossier prêt à signer » (radar/dossier.py) : visible sur le site et dans les alertes seulement quand l'IA est active.
dossier:
  nom: "Dossier prêt à signer"
  prix: 199
  prix_pro: 149
  lien_paiement: "https://buy.stripe.com/14AcMYeUg9Pz7iVdXi3F606"     # rempli par le workflow stripe.yml
  lien_pro: "https://buy.stripe.com/aFa4gsdQc0eZav7dXi3F607"
  prix_cle: 99          # dossier en plus des dossiers inclus de l'offre Clé en main
  lien_cle: "https://buy.stripe.com/bJe14gdQcaTDcDff1m3F60a"
  stripe_link_ids: ["plink_1UR6bR79764n3f0z06tqO6sM", "plink_1UR6bS79764n3f0zSJod1CIZ", "plink_1URDTy79764n3f0zfyNq3S33"]
  adresse: "dossier@elkaurtel.resend.app"   # réception Resend des pièces envoyées par le client
  rapport_adresse: "rapport@elkaurtel.resend.app"   # demandes de rapport « comment gagner » (offre Clé en main)
  modele: "claude-opus-5-5"
  delai_min_jours: 5    # en dessous : remboursement automatique
# Adresse de réception Resend (…@xxxx.resend.app) pour les changements de critères automatiques (vide = vers email_contact, traité à la main)
criteres_adresse: "criteres@elkaurtel.resend.app"
compte_adresse: "compte@elkaurtel.resend.app"   # demandes de lien « Mon compte » (lues par bienvenue.yml)
# Alerte gratuite limitée (radar/gratuit.py) : retirée le 2026-10-16 à la demande du propriétaire.
# Pour la remettre : alerte_gratuite: {adresse: "alerte@elkaurtel.resend.app"}
portail_client: "https://billing.stripe.com/p/login/dRm8wIfYk1j39r3aL63F600"
# Statistiques de visites sans cookie (GoatCounter) : nom du compte, ex. "radarmarches"
statistiques_goatcounter: "radarmarches"
google_verification: "SZybI2SsjlqSJ8IoP4km9vdFVcCDOwgf5n3LTYSsxe4"
stripe_mode: "réel"
essai_gratuit_jours: 7   # un seul essai par client (même e-mail ou même carte), radar/paliers.py
nouvelle_grille_anciens: true   # choix du 2026-10-18 : appliquer aussi les paliers aux abonnements créés avant nouvelle_grille_depuis

# Fiscalité micro-entreprise (taux 2026, BNC non réglementé, à vérifier sur urssaf.fr)
fiscalite:
  regime: "micro-entreprise BNC"
  taux_cotisations: 0.232       # 0.116 la 1re année avec l'ACRE
  taux_cfp: 0.002
  taux_versement_liberatoire: 0.022   # 0 si non choisi (impôt calculé ensuite au barème)
  tva: "TVA non applicable, art. 293 B du CGI"

