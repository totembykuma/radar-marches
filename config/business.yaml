  siret: "911 661 932 00036"
  adresse: "42 chemin Royal, 91310 Linas"
  hebergeur: "GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA"

# Prospection : 1 seul e-mail par entreprise ayant gagné un marché public récemment (avis « Résultat de marché »).
# Reste inactive tant que « actif » est false ou qu'aucun expéditeur dédié n'est configuré.
prospection:
  actif: true
  par_jour: 10
  expediteur: "Radar Marchés <bonjour@radar-marches.fr>"
