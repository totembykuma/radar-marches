# Film de l'accueil (templates/_film.html) : 19 s, sans voix, musique jazz (static/film.mp3, faite par scripts/film_musique.py).
# Une entrée par scène, dans l'ordre. ms : durée de la scène ; m : moments (en s depuis le début de la scène) où les éléments apparaissent ;
# cap : sous-titre affiché sous la vidéo. La dernière scène reste affichée (durée = fin de la musique).
# Après modification : relancer le workflow film.yml, qui refait la musique et l'aperçu MP4.
scenes:
  - id: matin
    titre: "Chaque matin"
    ms: 3400
    m: [0, 1.0]
    cap: "Chaque jour, des centaines de marchés publics sont publiés. Chaque matin, vous recevez ceux de votre métier, près de chez vous."
  - id: alerte
    titre: "L'alerte"
    ms: 3600
    m: [0]
    cap: "Un e-mail clair : objet, acheteur, date limite et lien vers l'avis officiel. Ici, un vrai avis ouvert en ce moment."
  - id: fiche
    titre: "Avant de répondre"
    ms: 3800
    m: [0, 0.6]
    cap: "Avec Pro : ce que l'acheteur a déjà payé et combien d'entreprises ont répondu."
  - id: offres
    titre: "Nos offres"
    ms: 5200
    m: [0, 0.5, 1.0]
    cap: "Le prix baisse dès le 3e mois, puis encore dès le 6e. Sans engagement."
  - id: fin
    titre: "À vous"
    ms: 3400
    m: [0, 0.4]
    cap: "7 jours d'essai gratuit, sans engagement, résiliable en un clic."
