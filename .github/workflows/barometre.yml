name: Baromètre mensuel
# Le 1er de chaque mois : chiffres du mois écoulé (data/barometre/), publiés par le site au prochain envoi du matin.
on:
  schedule:
    - cron: "10 3 1 * *"
  workflow_dispatch:
    inputs:
      mois: { description: "Mois AAAA-MM (vide = mois écoulé)", required: false, default: "" }
permissions:
  contents: write
  actions: write
concurrency: { group: radar-barometre, cancel-in-progress: false }
jobs:
  barometre:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m radar.cli barometre ${{ inputs.mois && format('--mois {0}', inputs.mois) || '' }}
      - name: Enregistrer
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/barometre
          git diff --cached --quiet || git commit -m "Baromètre $(date -I)"
          git pull -q --rebase origin main && git push
      - name: Republier le site avec les nouvelles données
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run site.yml --ref main -R ${{ github.repository }}
