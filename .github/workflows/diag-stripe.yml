name: Diagnostic Stripe (temporaire)
on:
  push: { branches: [claude/project-thread-6yz7un], paths: [scripts/diag_stripe.py, .github/workflows/diag-stripe.yml] }
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env: { STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}" }
        run: python scripts/diag_stripe.py
