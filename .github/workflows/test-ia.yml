name: Aperçu alerte IA (vrais avis, aucun e-mail)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-8crrze]
    paths: [".github/workflows/test-ia.yml", "scripts/apercu_ia.py"]
permissions: { contents: write }
jobs:
  apercu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: PYTHONPATH=. python scripts/apercu_ia.py nettoyage 75 2>&1 | tail -5
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add -f apercu-ia/alerte.html && git commit -qm "Aperçu alerte IA" && git push -q
