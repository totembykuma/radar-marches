name: Test de l'IA (une question, aucun e-mail)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-8crrze]
    paths: [".github/workflows/test-ia.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          python - <<'PY'
          import os, requests
          k = os.getenv("ANTHROPIC_API_KEY", "").strip()
          print("cle presente :", bool(k))
          r = requests.post("https://api.anthropic.com/v1/messages", timeout=60, headers={
              "x-api-key": k, "anthropic-version": "2023-06-01", "content-type": "application/json"},
              json={"model": "claude-haiku-5-5", "max_tokens": 50,
                    "messages": [{"role": "user", "content": "Résume en 10 mots : marché de nettoyage des écoles de Paris, 2 ans."}]})
          print("statut HTTP :", r.status_code)
          print(r.text[:400])
          PY
