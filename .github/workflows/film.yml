name: Aperçu du film (MP4)
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Polices du site
        run: |
          mkdir -p static/fonts
          curl -fsSL -o static/fonts/inter.woff2 https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2
          curl -fsSL -o static/fonts/jakarta.woff2 https://cdn.jsdelivr.net/npm/@fontsource-variable/plus-jakarta-sans@5/files/plus-jakarta-sans-latin-wght-normal.woff2
      - name: Site avec les données réelles du jour (aucun e-mail envoyé)
        run: python -m radar.cli essai | tail -5
      - run: python scripts/film_video.py out/site out/film-explicatif.mp4
      - name: Publier l'aperçu sur la branche apercu-film
        run: |
          cd out && git init -q apercu && cp film-explicatif.mp4 apercu/ && cd apercu
          git config user.name "radar-bot" && git config user.email "radar-bot@users.noreply.github.com"
          git checkout -q -b apercu-film && git add film-explicatif.mp4 && git commit -qm "Aperçu du film"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apercu-film
