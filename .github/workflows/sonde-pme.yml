name: Sonde PME (compteurs seulement)
on:
  workflow_dispatch: {}
  push: { branches: [claude/project-thread-a65qn5], paths: [scripts/sonde_pme.py] }
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/sonde_pme.py
