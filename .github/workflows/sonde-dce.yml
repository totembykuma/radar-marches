name: Sonde DCE (adresses des dossiers de consultation)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-f0yynh]
    paths: [scripts/sonde_dce.py]
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/sonde_dce.py
