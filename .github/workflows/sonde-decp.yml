name: Sonde données essentielles (temporaire)
on:
  push:
    branches: [claude/project-thread-nlesq9]
    paths: [scripts/sonde_decp.py, .github/workflows/sonde-decp.yml, radar/laureats.py, radar/barometre.py, radar/linkedin.py]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m radar.cli entreprises --budget 400 | tail -c 200
      - run: python -m radar.cli barometre --mois 2026-09 | tail -c 300
      - run: python -m radar.cli essai | tail -c 300
      - name: Aperçu (branche apercu-site)
        run: |
          mkdir ap && cd out/site && cp -r static barometre linkedin ../../ap/ && mkdir ../../ap/entreprises && cp entreprises/index.html ../../ap/entreprises/
          ls entreprises/*.html | head -5 | xargs -I{} cp {} ../../ap/entreprises/ && cp -r entreprises/departements ../../ap/entreprises/
          cd ../../ap && git init -q -b apercu-site && git config user.name radar-bot && git config user.email radar-bot@users.noreply.github.com
          git add -A && git commit -qm apercu && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercu-site
