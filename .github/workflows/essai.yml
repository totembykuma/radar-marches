name: Essai à blanc (vraies données, aucun e-mail)
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/essai.yml", "config/metiers.yaml", "radar/matching.py"]
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m radar.cli essai
      - uses: actions/upload-artifact@v4
        with: { name: site-apercu, path: out/site }
