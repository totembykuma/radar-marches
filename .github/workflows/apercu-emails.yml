name: Aperçu des e-mails (envoyés au propriétaire)
on: { workflow_dispatch: {} }
jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env: { RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", OWNER_EMAIL: "${{ secrets.OWNER_EMAIL }}" }
        run: python -m radar.cli apercu-emails
