name: Prospection (1 e-mail unique par entreprise)
on:
  schedule:
    - cron: "40 7 * * 2-5"
  workflow_dispatch:
    inputs:
      apercu:
        description: "Envoyer un apercu au proprietaire (aucun envoi au prospect)"
        type: boolean
        default: true
      bilan:
        description: "Renvoyer le recapitulatif du dernier envoi au proprietaire (aucun envoi au prospect)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: radar-prospection, cancel-in-progress: false }
jobs:
  prospection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Prospection
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_INBOUND_KEY: ${{ secrets.RESEND_INBOUND_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python -m radar.cli prospection ${{ inputs.bilan && '--bilan' || (inputs.apercu && '--apercu' || '') }}
      - name: Memoriser les entreprises contactees
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prospection du $(date -I)"
          git pull --rebase -q && git push
