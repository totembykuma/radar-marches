name: Sonde villes et bilan du dimanche (essai)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-l4f5en]
    paths: [scripts/sonde_villes.py, .github/workflows/sonde-villes.yml]
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/sonde_villes.py
      - name: Bilan du dimanche (envoi réel au propriétaire)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python -m radar.cli weekly | python -c "import sys,json; d=json.load(sys.stdin)['kpi']; print({k: d[k] for k in ('visites_7j','prospects_contactes_7j','prospects_clics_7j','essais_commences_7j','ventes_7j','abonnes_payants','mrr')})"
