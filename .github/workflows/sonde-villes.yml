name: Sonde villes et visites (compteurs seulement)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-l4f5en]
    paths: [scripts/sonde_villes.py, .github/workflows/sonde-villes.yml]
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/sonde_villes.py
