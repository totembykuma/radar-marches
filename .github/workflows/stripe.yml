name: Configurer Stripe (offres et liens de paiement)
on:
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env: { STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}" }
        run: python -m radar.stripe_setup
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add config/business.yaml
          git diff --cached --quiet || git commit -m "Liens de paiement Stripe"
          git push
