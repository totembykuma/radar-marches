name: Signaler le site à Bing (IndexNow, manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - uses: actions/checkout@v4
        with: { path: code }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: IndexNow
        working-directory: code
        run: python -c "from radar import site; from radar.config import business; print(site.indexnow(business(), '../site'))"
