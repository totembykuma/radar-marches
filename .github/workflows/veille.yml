name: Veille (envoi quotidien bien passé ?)
on:
  schedule:
    - cron: "0 8 * * 1-5"   # 10 h heure de Paris : l'envoi de 6 h 20 doit être fini
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          ACCES_OFFERTS: ${{ secrets.ACCES_OFFERTS }}
        run: python -m radar.cli veille
      - name: Relancer l'envoi quotidien s'il n'a pas tourné
        env: { GH_TOKEN: "${{ github.token }}" }
        run: if [ -f out/relancer ]; then gh workflow run daily.yml --ref main; fi
