name: Bienvenue maintenant (temporaire)
on:
  push: { branches: [claude/project-thread-6yz7un], paths: [.github/workflows/bienvenue-maintenant.yml] }
permissions: { contents: write }
jobs:
  bienvenue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python -m radar.cli bienvenue
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git rm -q .github/workflows/bienvenue-maintenant.yml
          git add data/state.json
          git commit -m "Bienvenue envoyée au nouvel abonné"
          git push origin HEAD:claude/project-thread-6yz7un
