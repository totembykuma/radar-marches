name: Dossiers prêts à signer
on:
  schedule:
    - cron: "15 5-19 * * 1-6"   # toutes les heures, ~7 h à 21 h heure de Paris, du lundi au samedi
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: radar-dossiers, cancel-in-progress: false }
jobs:
  dossiers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_INBOUND_KEY: ${{ secrets.RESEND_INBOUND_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python -m radar.cli dossiers
      - if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Dossiers du $(date -I)"
          git pull --rebase -q && git push
