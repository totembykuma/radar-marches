name: Envoi quotidien et site
on:
  schedule:
    - cron: "20 4 * * 1-5"   # du lundi au vendredi, ~6h20 heure de Paris
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: radar-daily, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Alertes + génération du site
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STRIPE_LINK_ESSENTIEL: ${{ vars.STRIPE_LINK_ESSENTIEL }}
          STRIPE_LINK_PRO: ${{ vars.STRIPE_LINK_PRO }}
        run: python -m radar.cli daily
      - name: Mémoriser l'état (avis déjà envoyés, journaux sans données personnelles)
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Etat du $(date -I)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: out/site }
  deploy:
    needs: daily
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
