name: Envoi quotidien et site
on:
  schedule:
    # Du lundi au vendredi vers 6 h 20 heure de Paris, été comme hiver : GitHub ne connaît que l'heure UTC,
    # on programme donc 4 h 20 ET 5 h 20 UTC ; l'étape « garde » ne laisse passer que le premier passage
    # après 6 h à Paris (l'autre s'arrête aussitôt). GitHub peut retarder un départ de quelques minutes à ~1 h.
    - cron: "20 4 * * 1-5"
    - cron: "20 5 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: radar-daily, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Garde (un seul envoi par jour, pas avant 6 h à Paris)
        id: garde
        run: |
          h=$(TZ=Europe/Paris date +%-H); j=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$h" -lt 6 ] || [ -f "data/runs/$j.json" ]; }; then
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "Rien à faire : déjà passé aujourd'hui ou trop tôt ($h h à Paris)."
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.garde.outputs.go == '1'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - if: steps.garde.outputs.go == '1'
        run: pip install -r requirements.txt
      - name: Polices du site (facultatif, repli sur les polices système)
        if: steps.garde.outputs.go == '1'
        run: |
          mkdir -p static/fonts
          curl -fsSL -o static/fonts/inter.woff2 https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2 || rm -f static/fonts/inter.woff2
          curl -fsSL -o static/fonts/jakarta.woff2 https://cdn.jsdelivr.net/npm/@fontsource-variable/plus-jakarta-sans@5/files/plus-jakarta-sans-latin-wght-normal.woff2 || rm -f static/fonts/jakarta.woff2
          ls -la static/fonts
      - name: Alertes + génération du site
        if: steps.garde.outputs.go == '1'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_INBOUND_KEY: ${{ secrets.RESEND_INBOUND_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STRIPE_LINK_ESSENTIEL: ${{ vars.STRIPE_LINK_ESSENTIEL }}
          STRIPE_LINK_PRO: ${{ vars.STRIPE_LINK_PRO }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m radar.cli daily
      - name: Mémoriser l'état (avis déjà envoyés, journaux sans données personnelles)
        if: always() && steps.garde.outputs.go == '1'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Etat du $(date -I)"
          git push
      - name: Publier le site (branche gh-pages)
        if: steps.garde.outputs.go == '1'
        run: |
          cd out/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -qm "Site du $(date -I)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
