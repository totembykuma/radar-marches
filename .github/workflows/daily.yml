name: Envoi quotidien et site
on:
  schedule:
    - cron: "20 4 * * 1-5"   # du lundi au vendredi, ~6h20 heure de Paris
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: radar-daily, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Polices du site (facultatif, repli sur les polices système)
        run: |
          mkdir -p static/fonts
          curl -fsSL -o static/fonts/inter.woff2 https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2 || rm -f static/fonts/inter.woff2
          curl -fsSL -o static/fonts/jakarta.woff2 https://cdn.jsdelivr.net/npm/@fontsource-variable/plus-jakarta-sans@5/files/plus-jakarta-sans-latin-wght-normal.woff2 || rm -f static/fonts/jakarta.woff2
          ls -la static/fonts
      - name: Alertes + génération du site
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STRIPE_LINK_ESSENTIEL: ${{ vars.STRIPE_LINK_ESSENTIEL }}
          STRIPE_LINK_PRO: ${{ vars.STRIPE_LINK_PRO }}
        run: python -m radar.cli daily
      - name: Mémoriser l'état (avis déjà envoyés, journaux sans données personnelles)
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Etat du $(date -I)"
          git push
      - name: Publier le site (branche gh-pages)
        run: |
          cd out/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -qm "Site du $(date -I)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
