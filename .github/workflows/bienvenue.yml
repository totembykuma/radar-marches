name: Bienvenue rapide (nouveaux abonnés)
on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes : le message de bienvenue part juste après l'inscription
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: radar-daily, cancel-in-progress: false }
jobs:
  bienvenue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar.cli bienvenue
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Bienvenue envoyée"
          git pull -q --rebase origin main && git push
